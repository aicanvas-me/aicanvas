name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Registry JSON, component source strings and icon data are generated, not
      # committed: tsc and the tests read the generated files.
      - run: npm run generate

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test
